<!-- Add this CSS to the main style block. -->
<style>
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: var(--rh-space-lg); align-items: center; max-width: 780px; }
  .flow-node { padding: var(--rh-space-xl); border: 1px solid var(--rh-gray-30); border-radius: var(--rh-radius); text-align: center; }
  .flow-node.active { border-color: var(--rh-red-50); background: var(--rh-red-05); }
  .flow-arrow { color: var(--rh-red-50); font-size: 24px; }
  @media (max-width: 767px) { .flow { grid-template-columns: 1fr; } .flow-arrow { transform: rotate(90deg); text-align: center; } }
</style>

<div class="flow" role="img" aria-label="Describe the actual process in one sentence">
  <div class="flow-node">Input</div><div class="flow-arrow" aria-hidden="true">→</div><div class="flow-node active">Process</div><div class="flow-arrow" aria-hidden="true">→</div><div class="flow-node">Output</div>
</div>
