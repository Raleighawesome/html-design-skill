<!-- Add this CSS to the main style block. -->
<style>
  .timeline { margin: 0; padding: 0; list-style: none; }
  .timeline li { position: relative; display: grid; grid-template-columns: 90px 1fr; gap: 22px; padding: 0 0 28px 24px; border-left: 1.5px solid var(--oat); }
  .timeline li::before { content: ""; position: absolute; left: -6px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--clay); }
  .timeline time { color: var(--gray-500); font-family: var(--mono); font-size: 11px; }
  @media (max-width: 640px) { .timeline li { grid-template-columns: 1fr; gap: 4px; } }
</style>

<ol class="timeline" aria-label="Timeline">
  <li><time datetime="2026-06">Jun 2026</time><div><strong>Milestone</strong><br>Describe the verified change or decision.</div></li>
</ol>
